services:
  - type: web
    name: culinary-journal
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
    disk:
      name: culinary-journal-data
      mountPath: /var/data
      sizeGB: 1
